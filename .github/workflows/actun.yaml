name: Build archfetch

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Nuitka and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka patchelf

    - name: Compile with Nuitka
      run: |
        python -m nuitka \
          --standalone \
          --onefile \
          --output-filename=archfetch \
          code.py

    - name: Upload compiled binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: archfetch-linux-x86_64
        path: archfetch
